# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: processor/cardinality_guardian

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Detect labels that grow at a constant rate instead of only those whose growth accelerates

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50403]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The epoch delta was computed from two independent per-epoch sketch estimates, which measures
  the change in growth rate rather than the rate itself. A label gaining a steady number of new
  unique values each epoch produced a delta of zero from the second epoch onward and was never
  detected, at any threshold. Each tracker now keeps one cumulative sketch and compares its
  estimate against the value held at the last epoch boundary, so the delta is the number of
  unique values added during the epoch.

  Two further defects are fixed by the same change. The `otelcol_processor_cardinality_top.offenders`
  gauge read the same pair of estimates and so reported a constant unrelated to actual growth, and
  it retained the last epoch that had growth instead of clearing once a label stopped growing.

